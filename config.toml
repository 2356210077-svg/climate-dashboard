[theme]
# Theme Tối (Dark) - Sang trọng, hiện đại
base="dark"

# Màu chính: Xanh Mòng Két phát sáng (Electric Teal) - Tạo điểm nhấn công nghệ
primaryColor="#00F4B0"

# Màu nền chính: Xanh Navy Cực Đậm - Tạo chiều sâu
backgroundColor="#0a192f"

# Màu nền phụ (Sidebar, Card): Xanh Navy nhạt hơn
secondaryBackgroundColor="#172a45"

# Màu chữ: Trắng ngà - Dễ đọc, không chói
textColor="#FAFAFA"

# Font chữ: Sans serif (Sạch sẽ, khớp với font Lato đã nhúng trong app.py)
font="sans serif"