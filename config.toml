[theme]
# Bắt buộc chế độ tối
base="dark"

# Màu chính (Primary Color): Dùng cho các nút bấm, thanh trượt, viền focus
# Lấy mã màu Xanh Ngọc Sáng từ gradient của bạn (#33FFBB)
primaryColor="#33FFBB"

# Màu nền chính (Background Color):
# Dùng màu tối đậm trùng với màu nền sidebar để đồng bộ khi ảnh nền chưa kịp tải
backgroundColor="#020617"

# Màu nền phụ (Secondary Background): Dùng cho Sidebar và các thẻ input
secondaryBackgroundColor="#0F172A"

# Màu chữ (Text Color): Màu trắng xám dịu mắt
textColor="#E0E6ED"

# Font chữ mặc định
font="sans serif"